<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">EvalBR measurement lifecycle and publication control plane</title>
  <desc id="desc">Architecture showing the benchmark contract, provider execution, immutable evidence, task-specific scoring, statistical analysis, executable release gates and decision report.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06080d"/><stop offset="1" stop-color="#0b1018"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#66fff5"/><stop offset="1" stop-color="#36e4da"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#b6adff"/><stop offset="1" stop-color="#8b7bff"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#59687b"/></marker>
    <marker id="arrowC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#36e4da"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".34"/></filter>
  </defs>
  <rect width="1600" height="1040" rx="28" fill="url(#bg)"/>
  <text x="70" y="66" fill="#36e4da" font-family="ui-monospace,monospace" font-size="14" font-weight="700" letter-spacing="4">MEASUREMENT SYSTEM / END-TO-END</text>
  <text x="70" y="116" fill="#f4f7fb" font-family="Arial" font-size="38" font-weight="760">From benchmark contract to publishable evidence</text>
  <text x="70" y="149" fill="#8795a8" font-family="Arial" font-size="17">Every number is traceable. Every claim has a gate. Failed runs stay diagnostic and never become a recommendation.</text>

  <g transform="translate(70 202)">
    <rect width="1460" height="152" rx="20" fill="#0d131d" stroke="#273344"/>
    <text x="24" y="31" fill="#36e4da" font-family="ui-monospace,monospace" font-size="12" font-weight="700">01 · BENCHMARK CONTRACT</text>
    <g transform="translate(24 55)" filter="url(#shadow)">
      <rect width="250" height="72" rx="12" fill="#080c12" stroke="#2b394a"/><text x="18" y="29" fill="#f4f7fb" font-family="Arial" font-size="16" font-weight="700">5 PT-BR tasks</text><text x="18" y="51" fill="#718094" font-family="Arial" font-size="12">operational failure modes</text>
      <g transform="translate(286)"><rect width="250" height="72" rx="12" fill="#080c12" stroke="#2b394a"/><text x="18" y="29" fill="#f4f7fb" font-family="Arial" font-size="16" font-weight="700">Versioned JSONL</text><text x="18" y="51" fill="#718094" font-family="Arial" font-size="12">750 items · SHA-256</text></g>
      <g transform="translate(572)"><rect width="250" height="72" rx="12" fill="#080c12" stroke="#2b394a"/><text x="18" y="29" fill="#f4f7fb" font-family="Arial" font-size="16" font-weight="700">Semantic families</text><text x="18" y="51" fill="#718094" font-family="Arial" font-size="12">clustered inference unit</text></g>
      <g transform="translate(858)"><rect width="250" height="72" rx="12" fill="#080c12" stroke="#2b394a"/><text x="18" y="29" fill="#f4f7fb" font-family="Arial" font-size="16" font-weight="700">Prompt variants</text><text x="18" y="51" fill="#718094" font-family="Arial" font-size="12">minimal × optimized</text></g>
      <g transform="translate(1144)"><rect width="268" height="72" rx="12" fill="#080c12" stroke="#2b394a"/><text x="18" y="29" fill="#f4f7fb" font-family="Arial" font-size="16" font-weight="700">Private holdout</text><text x="18" y="51" fill="#718094" font-family="Arial" font-size="12">local · never committed</text></g>
    </g>
  </g>
  <path d="M800 354v40" stroke="#59687b" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(70 410)">
    <rect width="700" height="250" rx="20" fill="#0d131d" stroke="#273344"/>
    <text x="24" y="32" fill="#9b8cff" font-family="ui-monospace,monospace" font-size="12" font-weight="700">02 · EXECUTION PLANE</text>
    <g transform="translate(24 57)">
      <rect width="200" height="70" rx="12" fill="#080c12" stroke="#2b394a"/><text x="16" y="28" fill="#f4f7fb" font-family="Arial" font-size="15" font-weight="700">Provider port</text><text x="16" y="49" fill="#718094" font-family="Arial" font-size="11">no vendor SDK coupling</text>
      <path d="M214 35h42" stroke="#59687b" stroke-width="2" marker-end="url(#arrow)"/>
      <g transform="translate(270)"><rect width="200" height="70" rx="12" fill="#080c12" stroke="#2b394a"/><text x="16" y="28" fill="#f4f7fb" font-family="Arial" font-size="15" font-weight="700">Preflight</text><text x="16" y="49" fill="#718094" font-family="Arial" font-size="11">fail before 2,250 calls</text></g>
      <path d="M484 35h42" stroke="#59687b" stroke-width="2" marker-end="url(#arrow)"/>
      <g transform="translate(540)"><rect width="112" height="70" rx="12" fill="#080c12" stroke="#2b394a"/><text x="14" y="28" fill="#f4f7fb" font-family="Arial" font-size="14" font-weight="700">Runner</text><text x="14" y="49" fill="#718094" font-family="Arial" font-size="10">4 workers</text></g>
      <g transform="translate(0 96)"><rect width="200" height="66" rx="12" fill="#080c12" stroke="#2b394a"/><text x="16" y="27" fill="#f4f7fb" font-family="Arial" font-size="14" font-weight="700">Retry + jitter</text><text x="16" y="48" fill="#718094" font-family="Arial" font-size="11">429 · 5xx · timeout</text></g>
      <g transform="translate(226 96)"><rect width="200" height="66" rx="12" fill="#080c12" stroke="#2b394a"/><text x="16" y="27" fill="#f4f7fb" font-family="Arial" font-size="14" font-weight="700">Content cache</text><text x="16" y="48" fill="#718094" font-family="Arial" font-size="11">model × prompt × seed</text></g>
      <g transform="translate(452 96)"><rect width="200" height="66" rx="12" fill="#080c12" stroke="#2b394a"/><text x="16" y="27" fill="#f4f7fb" font-family="Arial" font-size="14" font-weight="700">Cascade route</text><text x="16" y="48" fill="#718094" font-family="Arial" font-size="11">thread-safe counters</text></g>
    </g>
  </g>

  <g transform="translate(830 410)">
    <rect width="700" height="250" rx="20" fill="#0d131d" stroke="#273344"/>
    <text x="24" y="32" fill="#ffb86b" font-family="ui-monospace,monospace" font-size="12" font-weight="700">03 · IMMUTABLE EVIDENCE</text>
    <g transform="translate(24 57)">
      <rect width="200" height="105" rx="12" fill="#080c12" stroke="#2b394a"/><text x="16" y="28" fill="#f4f7fb" font-family="Arial" font-size="15" font-weight="700">Observation</text><text x="16" y="51" fill="#718094" font-family="Arial" font-size="11">raw response · score</text><text x="16" y="70" fill="#718094" font-family="Arial" font-size="11">tokens · cost · latency</text><text x="16" y="89" fill="#718094" font-family="Arial" font-size="11">attempts · error</text>
      <path d="M214 52h42" stroke="#59687b" stroke-width="2" marker-end="url(#arrow)"/>
      <g transform="translate(270)"><rect width="170" height="105" rx="12" fill="#080c12" stroke="#2b394a"/><text x="16" y="28" fill="#f4f7fb" font-family="Arial" font-size="15" font-weight="700">Manifest</text><text x="16" y="51" fill="#718094" font-family="Arial" font-size="11">exact model ID</text><text x="16" y="70" fill="#718094" font-family="Arial" font-size="11">dataset hashes</text><text x="16" y="89" fill="#718094" font-family="Arial" font-size="11">harness version</text></g>
      <path d="M454 52h42" stroke="#59687b" stroke-width="2" marker-end="url(#arrow)"/>
      <g transform="translate(510)"><rect width="142" height="105" rx="12" fill="#080c12" stroke="#2b394a"/><text x="16" y="28" fill="#f4f7fb" font-family="Arial" font-size="15" font-weight="700">Archive</text><text x="16" y="51" fill="#718094" font-family="Arial" font-size="11">deterministic</text><text x="16" y="70" fill="#718094" font-family="Arial" font-size="11">gzip · mtime 0</text></g>
      <rect y="184" width="652" height="35" rx="10" fill="#ffb86b" fill-opacity=".07" stroke="#ffb86b" stroke-opacity=".32"/>
      <text x="326" y="206" text-anchor="middle" fill="#ffd2a1" font-family="ui-monospace,monospace" font-size="11">NO AGGREGATION BEFORE RAW EVIDENCE IS PERSISTED</text>
    </g>
  </g>
  <path d="M800 660v40" stroke="#59687b" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(70 716)">
    <rect width="920" height="236" rx="20" fill="#0d131d" stroke="#273344"/>
    <text x="24" y="32" fill="#c5f46b" font-family="ui-monospace,monospace" font-size="12" font-weight="700">04 · MEASUREMENT</text>
    <g transform="translate(24 57)">
      <rect width="190" height="128" rx="12" fill="#080c12" stroke="#2b394a"/><text x="15" y="27" fill="#f4f7fb" font-family="Arial" font-size="14" font-weight="700">Task scorers</text><text x="15" y="50" fill="#718094" font-family="Arial" font-size="10">field accuracy</text><text x="15" y="68" fill="#718094" font-family="Arial" font-size="10">macro F1 · refusal</text><text x="15" y="86" fill="#718094" font-family="Arial" font-size="10">groundedness · choice</text>
      <path d="M204 64h34" stroke="#59687b" stroke-width="2" marker-end="url(#arrow)"/>
      <g transform="translate(252)"><rect width="190" height="128" rx="12" fill="#080c12" stroke="#2b394a"/><text x="15" y="27" fill="#f4f7fb" font-family="Arial" font-size="14" font-weight="700">Statistics</text><text x="15" y="50" fill="#718094" font-family="Arial" font-size="10">95% clustered bootstrap</text><text x="15" y="68" fill="#718094" font-family="Arial" font-size="10">paired prompt delta</text><text x="15" y="86" fill="#718094" font-family="Arial" font-size="10">run variance</text></g>
      <path d="M456 64h34" stroke="#59687b" stroke-width="2" marker-end="url(#arrow)"/>
      <g transform="translate(504)"><rect width="190" height="128" rx="12" fill="#080c12" stroke="#2b394a"/><text x="15" y="27" fill="#f4f7fb" font-family="Arial" font-size="14" font-weight="700">Unit economics</text><text x="15" y="50" fill="#718094" font-family="Arial" font-size="10">cost per item</text><text x="15" y="68" fill="#718094" font-family="Arial" font-size="10">p50 / p95</text><text x="15" y="86" fill="#718094" font-family="Arial" font-size="10">cascade escalation</text></g>
      <path d="M708 64h34" stroke="#59687b" stroke-width="2" marker-end="url(#arrow)"/>
      <g transform="translate(756)"><rect width="116" height="128" rx="12" fill="#080c12" stroke="#2b394a"/><text x="14" y="27" fill="#f4f7fb" font-family="Arial" font-size="14" font-weight="700">Pareto</text><text x="14" y="50" fill="#718094" font-family="Arial" font-size="10">quality</text><text x="14" y="68" fill="#718094" font-family="Arial" font-size="10">cost</text><text x="14" y="86" fill="#718094" font-family="Arial" font-size="10">latency</text></g>
    </g>
  </g>

  <g transform="translate(1030 716)">
    <rect width="500" height="236" rx="20" fill="#0d131d" stroke="#36e4da" stroke-opacity=".45"/>
    <text x="24" y="32" fill="#36e4da" font-family="ui-monospace,monospace" font-size="12" font-weight="700">05 · PUBLICATION CONTROL PLANE</text>
    <g transform="translate(24 56)" font-family="Arial">
      <g fill="#cbd5e1" font-size="12"><text y="18">✓ 2 real model configurations</text><text y="45">✓ 2 prompts × 3 repetitions</text><text y="72">✓ 5 tasks / 750 public items</text><text y="99">✓ provider errors ≤ 2%</text><text y="126">✓ current prices + exact model IDs</text><text y="153">✓ byte-stable committed report</text></g>
      <path d="M318 20v105" stroke="#36e4da" stroke-width="2" marker-end="url(#arrowC)"/>
      <rect x="338" y="14" width="112" height="44" rx="10" fill="#ffb86b" fill-opacity=".08" stroke="#ffb86b" stroke-opacity=".4"/><text x="394" y="41" text-anchor="middle" fill="#ffd2a1" font-family="ui-monospace,monospace" font-size="10">PRE-PUBLISH</text>
      <rect x="338" y="112" width="112" height="44" rx="10" fill="#36e4da" fill-opacity=".08" stroke="#36e4da" stroke-opacity=".45"/><text x="394" y="139" text-anchor="middle" fill="#8ffff7" font-family="ui-monospace,monospace" font-size="10">PUBLISHED</text>
    </g>
  </g>
  <text x="70" y="1004" fill="#4f5d70" font-family="ui-monospace,monospace" font-size="12">DATASET → REQUEST → RAW OBSERVATION → TASK METRIC → UNCERTAINTY → RELEASE GATE → DECISION</text>
</svg>
