<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Benchmark e Harness de Avaliação PT-BR — Brazilian Portuguese Model Intelligence</title>
  <desc id="desc">Editorial hero showing the Benchmark e Harness de Avaliação PT-BR benchmark, its five tasks and its quality, cost and latency decision surface.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080a10"/><stop offset="1" stop-color="#030408"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#66fff5"/><stop offset=".55" stop-color="#36e4da"/><stop offset="1" stop-color="#9b8cff"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#36e4da" stop-opacity=".24"/><stop offset="1" stop-color="#36e4da" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
    <filter id="shadow"><feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#000" flood-opacity=".55"/></filter>
  </defs>
  <rect width="1600" height="760" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="760" rx="28" fill="url(#grid)"/>
  <circle cx="300" cy="80" r="360" fill="url(#glow)"/>
  <g transform="translate(82 68)">
    <rect width="48" height="48" rx="14" fill="#36e4da"/>
    <path d="M15 13h21v7H23v5h11v7H23v5h13v7H15z" fill="#04100f"/>
    <text x="64" y="35" fill="#f5f8fb" font-family="Arial, sans-serif" font-size="26" font-weight="700">PT-BR <tspan fill="#36e4da">BENCHMARK</tspan></text>
    <text x="0" y="108" fill="#36e4da" font-family="monospace" font-size="15" font-weight="700" letter-spacing="4">BRAZILIAN PORTUGUESE MODEL INTELLIGENCE</text>
    <text x="0" y="185" fill="#f5f8fb" font-family="Arial, sans-serif" font-size="66" font-weight="760" letter-spacing="-3">Quality is not a score.</text>
    <text x="0" y="255" fill="url(#accent)" font-family="Arial, sans-serif" font-size="66" font-weight="760" letter-spacing="-3">It is a decision surface.</text>
    <text x="0" y="305" fill="#8d9aad" font-family="Arial, sans-serif" font-size="21">Five corporate PT-BR tasks. Quality, cost, latency and variance.</text>
    <text x="0" y="337" fill="#8d9aad" font-family="Arial, sans-serif" font-size="21">Measured together, with 95% clustered bootstrap confidence intervals.</text>
    <g transform="translate(0 390)">
      <g><rect width="150" height="76" rx="12" fill="#0d131c" stroke="#243140"/><text x="18" y="31" fill="#f5f8fb" font-family="Arial" font-size="25" font-weight="700">750</text><text x="18" y="55" fill="#718094" font-family="Arial" font-size="13">PUBLIC ITEMS</text></g>
      <g transform="translate(162)"><rect width="150" height="76" rx="12" fill="#0d131c" stroke="#243140"/><text x="18" y="31" fill="#f5f8fb" font-family="Arial" font-size="25" font-weight="700">339</text><text x="18" y="55" fill="#718094" font-family="Arial" font-size="13">SEMANTIC FAMILIES</text></g>
      <g transform="translate(324)"><rect width="150" height="76" rx="12" fill="#0d131c" stroke="#243140"/><text x="18" y="31" fill="#f5f8fb" font-family="Arial" font-size="25" font-weight="700">5</text><text x="18" y="55" fill="#718094" font-family="Arial" font-size="13">CORPORATE TASKS</text></g>
      <g transform="translate(486)"><rect width="150" height="76" rx="12" fill="#0d131c" stroke="#243140"/><text x="18" y="31" fill="#f5f8fb" font-family="Arial" font-size="25" font-weight="700">95%</text><text x="18" y="55" fill="#718094" font-family="Arial" font-size="13">CONFIDENCE</text></g>
    </g>
    <g transform="translate(0 512)" font-family="monospace" font-size="13">
      <rect width="170" height="34" rx="17" fill="#36e4da" fill-opacity=".08" stroke="#36e4da" stroke-opacity=".35"/><text x="85" y="22" text-anchor="middle" fill="#91fff8">FISCAL EXTRACTION</text>
      <g transform="translate(180)"><rect width="164" height="34" rx="17" fill="#36e4da" fill-opacity=".08" stroke="#36e4da" stroke-opacity=".35"/><text x="82" y="22" text-anchor="middle" fill="#91fff8">TICKET ROUTING</text></g>
      <g transform="translate(354)"><rect width="132" height="34" rx="17" fill="#36e4da" fill-opacity=".08" stroke="#36e4da" stroke-opacity=".35"/><text x="66" y="22" text-anchor="middle" fill="#91fff8">LGPD SAFETY</text></g>
      <g transform="translate(496)"><rect width="154" height="34" rx="17" fill="#36e4da" fill-opacity=".08" stroke="#36e4da" stroke-opacity=".35"/><text x="77" y="22" text-anchor="middle" fill="#91fff8">GROUNDED QA</text></g>
    </g>
  </g>
  <g transform="translate(870 96)" filter="url(#shadow)">
    <rect width="650" height="568" rx="22" fill="#0b1018" stroke="#2a3545"/>
    <text x="30" y="42" fill="#6f7d90" font-family="monospace" font-size="13" letter-spacing="2">DECISION SURFACE / QUALITY × COST</text>
    <line x1="68" y1="482" x2="608" y2="482" stroke="#415065"/>
    <line x1="68" y1="94" x2="68" y2="482" stroke="#415065"/>
    <g stroke="#fff" stroke-opacity=".07"><line x1="68" y1="385" x2="608" y2="385"/><line x1="68" y1="288" x2="608" y2="288"/><line x1="68" y1="191" x2="608" y2="191"/><line x1="68" y1="94" x2="608" y2="94"/></g>
    <path d="M92 400C172 355 210 322 270 300S390 219 442 178S526 132 582 112" fill="none" stroke="#36e4da" stroke-width="3" stroke-dasharray="8 7"/>
    <g fill="#36e4da"><circle cx="92" cy="400" r="9"/><circle cx="270" cy="300" r="9"/><circle cx="442" cy="178" r="9"/><circle cx="582" cy="112" r="9"/></g>
    <g fill="#0b1018" stroke="#657287" stroke-width="2"><circle cx="210" cy="365" r="8"/><circle cx="386" cy="281" r="8"/><circle cx="515" cy="227" r="8"/></g>
    <g fill="#eef5f8" font-family="monospace" font-size="12"><text x="108" y="389">small / optimized</text><text x="286" y="288">mid / optimized</text><text x="458" y="166">large / optimized</text></g>
    <text x="338" y="530" text-anchor="middle" fill="#718094" font-family="Arial" font-size="14">COST PER ITEM (USD) →</text>
    <text transform="translate(24 290) rotate(-90)" text-anchor="middle" fill="#718094" font-family="Arial" font-size="14">QUALITY →</text>
  </g>
  <text x="82" y="710" fill="#4f5d70" font-family="monospace" font-size="13">REPRODUCIBLE · PROVIDER-AGNOSTIC · VERSIONED RESULTS · NO CUSTOMER DATA</text>
</svg>
