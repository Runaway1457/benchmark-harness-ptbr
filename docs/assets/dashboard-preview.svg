<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">EvalBR decision dashboard preview</title>
  <desc id="desc">Faithful visual preview of the generated static dashboard, showing calibration status, benchmark scale, Pareto decision surface and task results.</desc>
  <defs>
